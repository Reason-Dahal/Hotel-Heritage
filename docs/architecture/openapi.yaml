openapi: 3.0.3
info:
  title: Hotel Website API
  description: >
    API contract for the Hotel Website system. Public GET endpoints are
    open to all visitors. All write operations (POST/PUT/PATCH/DELETE)
    require an authenticated admin session (NextAuth session cookie).
  version: 1.0.0

servers:
  - url: https://your-hotel-site.vercel.app/api
    description: Production (Vercel)
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: Rooms
  - name: Menu
  - name: Notices
  - name: Auth
  - name: Settings
  - name: Categories
  - name: Gallery

paths:
  /rooms:
    get:
      tags: [Rooms]
      summary: List all rooms
      description: Public. Returns all rooms for the "All Rooms" page and featured slideshow.
      responses:
        "200":
          description: Array of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      tags: [Rooms]
      summary: Create a new room
      description: Admin only.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          description: Not authenticated as admin

  /rooms/{id}:
    put:
      tags: [Rooms]
      summary: Update a room
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "200":
          description: Room updated
        "401":
          description: Not authenticated as admin
        "404":
          description: Room not found
    delete:
      tags: [Rooms]
      summary: Delete a room
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Room deleted
        "401":
          description: Not authenticated as admin
        "404":
          description: Room not found

  /menu:
    get:
      tags: [Menu]
      summary: List all menu items
      description: Public. Returns all items for the "Full Menu" page and signature dish slideshow.
      responses:
        "200":
          description: Array of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      tags: [Menu]
      summary: Create a new menu item
      description: Admin only.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Menu item created
        "401":
          description: Not authenticated as admin

  /menu/{id}:
    put:
      tags: [Menu]
      summary: Update a menu item
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "200":
          description: Menu item updated
        "401":
          description: Not authenticated as admin
        "404":
          description: Menu item not found
    delete:
      tags: [Menu]
      summary: Delete a menu item
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Menu item deleted
        "401":
          description: Not authenticated as admin
        "404":
          description: Menu item not found

    /categories:
    get:
      tags: [Categories]
      summary: List categories in display order
      description: Public.
      responses:
        "200":
          description: Ordered categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      tags: [Categories]
      summary: Create a category
      description: Admin only. Names are unique, ignoring capital letters.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
        "400":
          description: Validation error
        "401":
          description: Not authenticated as admin
        "409":
          description: A category with that name already exists

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Rename a category
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Category renamed
        "400":
          description: Invalid id or validation error
        "401":
          description: Not authenticated as admin
        "404":
          description: Category not found
        "409":
          description: A category with that name already exists
    delete:
      tags: [Categories]
      summary: Delete a category
      description: Admin only. Refused while menu items use the category.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category deleted
        "401":
          description: Not authenticated as admin
        "404":
          description: Category not found
        "409":
          description: Menu items still use this category

  /categories/reorder:
    post:
      tags: [Categories]
      summary: Set the display order of categories
      description: Admin only. Send every category id in the desired order.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedIds]
              properties:
                orderedIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Order saved
        "400":
          description: Validation error
        "401":
          description: Not authenticated as admin

  /notices:
    get:
      tags: [Notices]
      summary: List active notices
      description: Public. Returns only notices with active=true, for the popup. Empty array means no popup shows.
      responses:
        "200":
          description: Array of active notices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notice"
    post:
      tags: [Notices]
      summary: Create a new notice
      description: Admin only.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeInput"
      responses:
        "201":
          description: Notice created
        "401":
          description: Not authenticated as admin

  /notices/{id}:
    patch:
      tags: [Notices]
      summary: Toggle a notice active/inactive
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Notice updated
        "401":
          description: Not authenticated as admin
    delete:
      tags: [Notices]
      summary: Delete a notice
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Notice deleted
        "401":
          description: Not authenticated as admin

  /settings:
    get:
      tags: [Settings]
      summary: Get site settings
      description: Public. Hotel name, contact details, social links, map, hero image, and banner messages.
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      tags: [Settings]
      summary: Update site settings
      description: Admin only. Creates the settings document on first save.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettings"
      responses:
        "200":
          description: Settings saved
        "400":
          description: Validation error
        "401":
          description: Not authenticated as admin

  /auth/login:
    post:
      tags: [Auth]
      summary: Admin login
      description: Handled by NextAuth Credentials provider. Sets a session cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful, session cookie set
        "401":
          description: Invalid credentials

    /gallery:
    get:
      tags: [Gallery]
      summary: List gallery photos in display order
      description: Public.
      responses:
        "200":
          description: Ordered gallery photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryImage"
    post:
      tags: [Gallery]
      summary: Add a photo to the gallery
      description: Admin only. The url must be a Cloudinary address. Maximum 30 photos.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryImageInput"
      responses:
        "201": { description: Photo added }
        "400": { description: Validation error }
        "401": { description: Not authenticated as admin }
        "409": { description: The gallery is full }

  /gallery/{id}:
    put:
      tags: [Gallery]
      summary: Update a photo's description
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alt]
              properties:
                alt: { type: string, maxLength: 160 }
      responses:
        "200": { description: Photo updated }
        "400": { description: Invalid id or validation error }
        "401": { description: Not authenticated as admin }
        "404": { description: Photo not found }
    delete:
      tags: [Gallery]
      summary: Remove a photo from the gallery
      description: Admin only.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200": { description: Photo removed }
        "401": { description: Not authenticated as admin }
        "404": { description: Photo not found }

  /gallery/reorder:
    post:
      tags: [Gallery]
      summary: Set the display order of gallery photos
      description: Admin only. Send every photo id in the desired order.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedIds]
              properties:
                orderedIds:
                  type: array
                  items:
                    type: string
      responses:
        "200": { description: Order saved }
        "400": { description: Validation error }
        "401": { description: Not authenticated as admin }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token

  schemas:
    Room:
      allOf:
        - type: object
          properties:
            _id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        - $ref: "#/components/schemas/RoomInput"

    RoomInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          example: "Deluxe Double Room"
        description:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        price:
          type: number
          example: 120
        discountPercent:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        capacity:
          type: integer
          example: 2
        featured:
          type: boolean
          default: false

    MenuItem:
      allOf:
        - type: object
          properties:
            _id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        - $ref: "#/components/schemas/MenuItemInput"

    MenuItemInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          example: "Grilled Salmon"
        description:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        category:
          type: string
          example: "Signature Dish"
        price:
          type: number
          example: 18.5
        discountPercent:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        featured:
          type: boolean
          default: false

        GalleryImage:
      type: object
      properties:
        _id: { type: string }
        url: { type: string }
        alt: { type: string }

    GalleryImageInput:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Cloudinary address (https://res.cloudinary.com/...)" }
        alt: { type: string, maxLength: 160 }

    Notice:
      allOf:
        - type: object
          properties:
            _id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        - $ref: "#/components/schemas/NoticeInput"

    NoticeInput:
      type: object
      required: [title, message]
      properties:
        title:
          type: string
        message:
          type: string
        image:
          type: string
          format: uri
        active:
          type: boolean
          default: false

        SiteSettings:
      type: object
      required: [hotelName]
      properties:
        hotelName: { type: string, maxLength: 100 }
        tagline: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 500 }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        facebookUrl: { type: string, description: "http(s) link or empty" }
        instagramUrl: { type: string }
        tiktokUrl: { type: string }
        youtubeUrl: { type: string }
        whatsappUrl: { type: string }
        mapEmbedUrl: { type: string, description: "Must start with https://www.google.com/maps/embed, or empty" }
        heroImage: { type: string }
        bannerMessages:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 200 }
        currency: { type: string, example: "NPR", description: "3-letter ISO currency code" }
